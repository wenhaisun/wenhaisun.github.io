{% if site.analytics.google.tracking_id and site.analytics.integrity.google_analytics_4 %}
<script async src="https://www.googletagmanager.com/gtag/js?id={{ site.analytics.google.tracking_id | escape }}" integrity="{{ site.analytics.integrity.google_analytics_4 | escape }}" crossorigin="anonymous"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', {{ site.analytics.google.tracking_id | jsonify }});
</script>
{% endif %}
